:root {
  --bg: #EFEEEA;
  --ink: #1E1B16;
  --muted: #6C665A;
  --paper: #FFFFFF;
  --line: #DCD8CF;
  --accent: #EC5C3A;
  --btn-bg: #6A5B37;
  --btn-fg: #FFFFFF;
  --field-bg: #FFFFFF;
  --field-line: #D3CEC3;
  --ring: rgba(236, 92, 58, .22);
  --font: "Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #14120E; --ink: #F1EEE7; --muted: #A69F90; --line: #36312A; --btn-bg: #EC5C3A; --btn-fg: #1A1510; --field-bg: #1E1B16; --field-line: #413B31; --ring: rgba(236, 92, 58, .35); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #14120E; --ink: #F1EEE7; --muted: #A69F90; --line: #36312A; --btn-bg: #EC5C3A; --btn-fg: #1A1510; --field-bg: #1E1B16; --field-line: #413B31; --ring: rgba(236, 92, 58, .35); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.t-touch { display: none; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
}
.page { max-width: 960px; margin: 0 auto; display: grid; gap: 18px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.15; }
.hint { margin: 4px 0 0; color: var(--muted); font-size: 17px; }

.paper { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 32px; display: flex; justify-content: center; overflow: hidden; }
@media (max-width: 560px) { .paper { padding: 18px 12px; } }
/* On narrow screens the signature stays pinned while you type in the fields below it. */
@media (max-width: 780px) {
  .pin { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 8px; margin-block: -8px; }
}
.fit { position: relative; flex: none; }
.stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; color: #000; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; max-width: none; }

.row { position: absolute; display: flex; gap: 3.2px; white-space: nowrap; font: 400 16px/20.928px var(--font); }
.ed { display: block; min-width: 12px; outline: 1px dashed transparent; outline-offset: 2px; border-radius: 1px; cursor: text; caret-color: var(--accent); }
.ed.b { font-weight: 700; }
.ed:hover { outline-color: rgba(236, 92, 58, .55); }
.ed:focus { outline: 1px solid var(--accent); background: rgba(236, 92, 58, .07); }
.ed:empty::before { content: attr(data-ph); color: #B5B0A6; font-weight: 400; }
.ed.linked { outline: 1px solid var(--accent); background: rgba(236, 92, 58, .09); }

/* Text fields */
.fields { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px 28px; align-items: start; }
@media (max-width: 780px) { .fields { grid-template-columns: minmax(0, 1fr); } }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 12px; }
legend { padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 359px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.f { display: grid; gap: 5px; min-width: 0; }
.f > span { font-size: 14px; font-weight: 600; color: var(--muted); }
.f input { width: 100%; min-width: 0; font: inherit; font-size: 17px; color: var(--ink); background: var(--field-bg); border: 1px solid var(--field-line); border-radius: 10px; padding: 11px 12px; transition: border-color .15s, box-shadow .15s; }
.f input.b { font-weight: 700; }
.f input:hover { border-color: var(--muted); }
.f input:focus, .f input.linked { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.note { margin: 0; font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .f input { transition: none; } }
@media (hover: none) {
  .t-touch { display: inline; }
  .t-mouse { display: none; }
  .ed { outline-color: rgba(236, 92, 58, .4); }
}

.actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 22px; background: var(--btn-bg); color: var(--btn-fg); cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { margin: 0; color: var(--muted); }

.fallback { margin: 0; display: grid; gap: 8px; justify-items: start; }
.fallback img { background: #fff; border: 1px solid var(--line); max-width: 100%; height: auto; }
.fallback figcaption { color: var(--muted); font-size: 15px; }
</style>

<main class="page">
  <header>
    <h1>Email signature</h1>
    <p class="hint"><span class="t-mouse">Click</span><span class="t-touch">Tap</span> any text on the signature, or use the fields below.</p>
  </header>

  <div class="pin" id="pin">
    <div class="paper" id="paper">
      <div class="fit" id="fit">
        <div class="stage" id="stage">
          <img id="art" alt="">
          <div class="row" id="r-phone"><span class="ed" data-k="phone" data-ph="Phone" dir="ltr" role="textbox" aria-label="Phone"></span></div>
          <div class="row" id="r-web"><span class="ed" data-k="web" data-ph="Website" dir="ltr" role="textbox" aria-label="Website"></span></div>
          <div class="row" id="r-address"><span class="ed" data-k="address" data-ph="Address" dir="auto" role="textbox" aria-label="Address"></span></div>
          <div class="row" id="r-name" dir="rtl"><span class="ed b" data-k="heName" data-ph="שם" dir="rtl" role="textbox" aria-label="שם" lang="he"></span><span class="ed" data-k="enTitle" data-ph="Title" dir="ltr" role="textbox" aria-label="Title in English"></span></div>
          <div class="row" id="r-title" dir="rtl"><span class="ed" data-k="enName" data-ph="Name" dir="ltr" role="textbox" aria-label="Name in English"></span><span class="ed b" data-k="heTitle" data-ph="תפקיד" dir="rtl" role="textbox" aria-label="תפקיד" lang="he"></span></div>
        </div>
      </div>
    </div>
  </div>

  <form class="fields" id="fields" autocomplete="off">
    <fieldset>
      <legend>Name and title</legend>
      <div class="pair">
        <label class="f"><span>Name in English</span><input type="text" data-k="enName" dir="ltr" autocapitalize="words" enterkeyhint="next"></label>
        <label class="f" dir="rtl" lang="he"><span>שם</span><input type="text" data-k="heName" dir="rtl" class="b" enterkeyhint="next"></label>
      </div>
      <div class="pair">
        <label class="f"><span>Title in English</span><input type="text" data-k="enTitle" dir="ltr" enterkeyhint="next"></label>
        <label class="f" dir="rtl" lang="he"><span>תפקיד</span><input type="text" data-k="heTitle" dir="rtl" class="b" enterkeyhint="next"></label>
      </div>
      <p class="note">The English name is also used for the file name.</p>
    </fieldset>
    <fieldset>
      <legend>Contact</legend>
      <label class="f"><span>Phone</span><input type="tel" data-k="phone" dir="ltr" enterkeyhint="next"></label>
      <label class="f"><span>Website</span><input type="text" data-k="web" dir="ltr" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></label>
      <label class="f"><span>Address</span><input type="text" data-k="address" dir="auto" enterkeyhint="done"></label>
    </fieldset>
  </form>

  <div class="actions">
    <button id="download" class="btn" type="button">Download GIF</button>
    <p id="msg" class="msg" role="status"></p>
  </div>

  <figure id="fallback" class="fallback" hidden>
    <img id="result" alt="Your signature as a GIF">
    <figcaption><span class="t-mouse">Right-click the image and choose Save Image As.</span><span class="t-touch">Press and hold the image to save it.</span></figcaption>
  </figure>
</main>

  const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (s && typeof s === 'object') for (const k in text) if (typeof s[k] === 'string') text[k] = s[k];
} catch (e) { /* storage unavailable */ }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(text)); } catch (e) { /* storage unavailable */ } };

/* ---------- place the editable lines exactly where the GIF draws them ---------- */
stage.style.width = W1 + 'px'; stage.style.height = H1 + 'px';
const place = (id, row, side) => {
  const el = $(id);
  el.dataset.base = SY(L.baselines[row]);
  el.style.top = (SY(L.baselines[row]) - ASCENT) + 'px';
  if (side === 'left') el.style.left = SX(L.leftX) + 'px';
  else el.style.right = (W1 - SX(L.rightX)) + 'px';
};
place('r-phone', 0, 'left'); place('r-web', 1, 'left'); place('r-address', 2, 'left');
place('r-name', 1, 'right'); place('r-title', 2, 'right');

let zoom = 1;
function fitStage() {
  const cs = getComputedStyle(paper);
  const avail = paper.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  zoom = Math.max(0.5, Math.min(2, avail / W1));
  stage.style.transform = `scale(${zoom})`;
  fit.style.width = (W1 * zoom) + 'px';
  fit.style.height = (H1 * zoom) + 'px';
  /* keep focused fields clear of the pinned signature on narrow screens */
  const pinned = window.matchMedia && matchMedia('(max-width: 780px)').matches;
  document.documentElement.style.scrollPaddingTop = pinned ? ($('pin').offsetHeight + 12) + 'px' : '';
}
fitStage();
if (window.ResizeObserver) new ResizeObserver(fitStage).observe(paper); else addEventListener('resize', fitStage);

/* ---------- editing: inline text and the fields below stay in sync ---------- */
const inputs = Array.from(document.querySelectorAll('#fields input'));
const spanFor = {}, inputFor = {};
eds.forEach((el) => { spanFor[el.dataset.k] = el; });
inputs.forEach((inp) => { inputFor[inp.dataset.k] = inp; });

function setText(k, value, from) {
  value = value.replace(/[\r\n]+/g, ' ');
  text[k] = value;
  const span = spanFor[k], inp = inputFor[k];
  if (from !== span) { span.textContent = value; if (value === '') span.innerHTML = ''; }
  if (from !== inp && inp.value !== value) inp.value = value;
  save();
  $('msg').textContent = '';
}

inputs.forEach((inp, i) => {
  inp.value = text[inp.dataset.k];
  inp.addEventListener('input', () => setText(inp.dataset.k, inp.value, inp));
  inp.addEventListener('focus', () => spanFor[inp.dataset.k].classList.add('linked'));
  inp.addEventListener('blur', () => spanFor[inp.dataset.k].classList.remove('linked'));
  inp.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (inputs[i + 1]) inputs[i + 1].focus(); else inp.blur();
  });
});
$('fields').addEventListener('submit', (e) => e.preventDefault());

for (const el of eds) {
  el.textContent = text[el.dataset.k];
  el.addEventListener('focus', () => inputFor[el.dataset.k].classList.add('linked'));
  el.addEventListener('blur', () => inputFor[el.dataset.k].classList.remove('linked'));
  el.setAttribute('contenteditable', 'plaintext-only');
  if (el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable', 'true');
  el.spellcheck = false;
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); el.blur(); } });
  el.addEventListener('beforeinput', (e) => { if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') { e.preventDefault(); el.blur(); } });
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    const t = (e.clipboardData ? e.clipboardData.getData('text/plain') : '').replace(/\s+/g, ' ');
    document.execCommand('insertText', false, t);
  });
  el.addEventListener('input', () => {
    if (/\n/.test(el.textContent)) el.textContent = el.textContent.replace(/\n/g, ' ');
    if (el.textContent === '') el.innerHTML = '';
    setText(el.dataset.k, el.textContent, el);
  });
}

/* ---------- palette (white background, black text, three brand colours) ---------- */
function mix(a, b, t) { return [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * t)); }
function makePalette() {
  const bg = [255, 255, 255], ink = [0, 0, 0];
  const cols = [];
  const add = (c) => { for (const p of cols) if ((p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2 < 9) return; cols.push(c); };
  add(bg); add(ink);
  for (let i = 1; i <= 8; i++) add(mix(bg, ink, i / 9));
  for (const b of BRAND) { add(b); for (let i = 1; i <= 4; i++) add(mix(bg, b, i / 5)); }
  for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) add(mix(BRAND[i], BRAND[j], 0.5));
  for (const b of BRAND) add(mix(b, ink, 0.5));
  const n = cols.length;
  let bits = 2; while ((1 << bits) < n + 1) bits++;
  const flat = new Uint8Array((1 << bits) * 3);
  cols.forEach((c, i) => flat.set(c, i * 3));
  const cache = new Map();
  function index(r, g, b) {
    r = r < 0 ? 0 : r > 255 ? 255 : Math.round(r);
    g = g < 0 ? 0 : g > 255 ? 255 : Math.round(g);
    b = b < 0 ? 0 : b > 255 ? 255 : Math.round(b);
    const key = (r << 16) | (g << 8) | b;
    let v = cache.get(key);
    if (v !== undefined) return v;
    let bd = Infinity; v = 0;
    for (let i = 0; i < n; i++) {
      const c = cols[i], dr = r - c[0], dg = g - c[1], db = b - c[2];
      const d = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
      if (d < bd) { bd = d; v = i; }
    }
    cache.set(key, v);
    return v;
  }
  return { flat, bits, transparent: n, index };
}
const PAL = makePalette();

/* ---------- GIF encoder (LZW, changed-area frames) ---------- */
class Bytes {
  constructor() { this.buf = new Uint8Array(1 << 16); this.n = 0; }
  grow(k) { if (this.n + k > this.buf.length) { let m = this.buf.length * 2; while (m < this.n + k) m *= 2; const nb = new Uint8Array(m); nb.set(this.buf.subarray(0, this.n)); this.buf = nb; } }
  byte(b) { this.grow(1); this.buf[this.n++] = b; }
  u16(v) { this.byte(v & 255); this.byte((v >> 8) & 255); }
  str(s) { for (let i = 0; i < s.length; i++) this.byte(s.charCodeAt(i)); }
  arr(a) { this.grow(a.length); this.buf.set(a, this.n); this.n += a.length; }
  result() { return this.buf.slice(0, this.n); }
}
const LZW_CODES = new Int16Array(1 << 20);
const LZW_STAMP = new Int32Array(1 << 20);
let lzwEpoch = 0;
function lzwWrite(out, minCode, px) {
  out.byte(minCode);
  const clear = 1 << minCode, eoi = clear + 1;
  let next = eoi + 1, size = minCode + 1, acc = 0, accBits = 0;
  const block = new Uint8Array(255); let bn = 0;
  const flush = () => { if (bn) { out.byte(bn); out.arr(block.subarray(0, bn)); bn = 0; } };
  const put = (b) => { block[bn++] = b; if (bn === 255) flush(); };
  const emit = (code) => { acc |= code << accBits; accBits += size; while (accBits >= 8) { put(acc & 255); acc >>>= 8; accBits -= 8; } };
  lzwEpoch++;
  emit(clear);
  let prefix = px[0];
  for (let i = 1; i < px.length; i++) {
    const k = px[i], key = (prefix << 8) | k;
    if (LZW_STAMP[key] === lzwEpoch) { prefix = LZW_CODES[key]; continue; }
    emit(prefix);
    if (next === 4096) { emit(clear); next = eoi + 1; size = minCode + 1; lzwEpoch++; }
    else { if (next >= (1 << size)) size++; LZW_CODES[key] = next++; LZW_STAMP[key] = lzwEpoch; }
    prefix = k;
  }
  emit(prefix); emit(eoi);
  if (accBits > 0) put(acc & 255);
  flush();
  out.byte(0);
}
function encodeGif(W, H, frames) {
  const out = new Bytes();
  out.str('GIF89a'); out.u16(W); out.u16(H);
  out.byte(0x80 | ((PAL.bits - 1) << 4) | (PAL.bits - 1)); out.byte(0); out.byte(0);
  out.arr(PAL.flat);
  out.byte(0x21); out.byte(0xFF); out.byte(11); out.str('NETSCAPE2.0'); out.byte(3); out.byte(1); out.u16(0); out.byte(0);
  let elapsed = 0, emitted = 0;
  for (const f of frames) {
    elapsed += f.ms;
    const cs = Math.max(2, Math.round(elapsed / 10) - emitted);
    emitted += cs;
    out.byte(0x21); out.byte(0xF9); out.byte(4);
    out.byte((1 << 2) | (f.transparent ? 1 : 0)); out.u16(cs);
    out.byte(f.transparent ? PAL.transparent : 0); out.byte(0);
    out.byte(0x2C); out.u16(f.x); out.u16(f.y); out.u16(f.w); out.u16(f.h); out.byte(0);
    lzwWrite(out, Math.max(2, PAL.bits), f.idx);
  }
  out.byte(0x3B);
  return out.result();
}

/* ---------- assets ---------- */
let sheetCls = null, sheetW = 0;
const icons = {};
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = src; });
async function prepare() {
  const keys = ['fb25', 'ig25', 'li25', 'fb50', 'ig50', 'li50'];
  const ims = await Promise.all(keys.map((k) => loadImg(A[k])));
  keys.forEach((k, i) => { icons[k] = ims[i]; });
  /* logo frames come in small strips so phones never decode one huge image */
  sheetW = A.cols * (A.frameW + A.gutter);
  sheetCls = new Uint8Array(sheetW * (A.frameH + A.gutter) * A.rows);
  await decodeStrip(0);   /* first strip holds the still logo */
}
async function decodeStrip(r) {
  const strip = await loadImg(A.strips[r]);
  const c = document.createElement('canvas');
  c.width = sheetW; c.height = A.frameH;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(strip, 0, 0);
  const px = new Uint32Array(x.getImageData(0, 0, c.width, c.height).data.buffer);
  const off = r * (A.frameH + A.gutter) * sheetW;
  for (let i = 0; i < px.length; i++) {
    const v = px[i];
    if ((v >>> 24) < 128) continue;            /* transparent */
    const red = v & 255;                        /* orange 236, purple 218, brown 106 */
    sheetCls[off + i] = red > 227 ? 1 : red > 160 ? 2 : 3;
  }
  c.width = c.height = 0;
}
let allFrames = null;
function framesReady() {
  if (!allFrames) allFrames = (async () => { for (let r = 1; r < A.rows; r++) { await decodeStrip(r); await tick(); } })();
  return allFrames;
}
async function fontsReady() {
  if (!document.fonts || !document.fonts.load) return;
  const loads = [];
  for (const w of ['400', '700']) { loads.push(document.fonts.load(`${w} 16px Assistant`, 'Benny 054')); loads.push(document.fonts.load(`${w} 16px Assistant`, 'בני')); }
  await Promise.race([Promise.allSettled(loads), new Promise((r) => setTimeout(r, 3000))]);
}

/* ---------- drawing ---------- */
const RTL_RE = /[֐-׿؀-ۿיִ-﷿ﹰ-﻿]/;
const LTR_RE = /[A-Za-zÀ-ɏͰ-ϿЀ-ӿ]/;
function isRTL(t) { for (const ch of t) { if (RTL_RE.test(ch)) return true; if (LTR_RE.test(ch)) return false; } return false; }

/* Text positions for the GIF, measured with the font itself (not read from the screen),
   so the export comes out the same on every device. Same layout rules as the editor. */
const GAP = 3.2;  /* one space in Assistant at 16px */
function readRuns() {
  const ctx = document.createElement('canvas').getContext('2d');
  const width = (t, w) => { ctx.font = `${w} 16px Assistant, Arial, sans-serif`; return ctx.measureText(t).width; };
  const val = (k) => (text[k] || '').replace(/\s+/g, ' ').trim();
  const runs = [];
  [['phone', 0], ['web', 1], ['address', 2]].forEach(([k, row]) => {
    const t = val(k);
    if (t) runs.push({ t, x: SX(L.leftX), base: SY(L.baselines[row]), w: '400' });
  });
  [[1, [['heName', '700'], ['enTitle', '400']]], [2, [['enName', '400'], ['heTitle', '700']]]].forEach(([row, items]) => {
    let x = SX(L.rightX), first = true;
    for (const [k, w] of items) {
      const t = val(k);
      if (!t) continue;
      if (!first) x -= GAP;
      x -= width(t, w);
      runs.push({ t, x, base: SY(L.baselines[row]), w });
      first = false;
    }
  });
  return runs;
}

function renderBase(s, runs) {
  const W = Math.round(W1 * s), H = Math.round(H1 * s);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000000'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  for (const r of runs) {
    ctx.font = `${r.w} ${16 * s}px Assistant, Arial, sans-serif`;
    try { ctx.direction = isRTL(r.t) ? 'rtl' : 'ltr'; } catch (e) { /* older browsers */ }
    ctx.fillText(r.t, r.x * s, Math.round(r.base * s));
  }
  const t = Math.max(1, Math.round(L.rule.w * s));
  const rx0 = Math.round(SX(L.rule.x0) * s), rx1 = Math.round(SX(L.rule.x1) * s);
  ctx.fillRect(rx0, Math.round(SY(L.rule.y) * s - t / 2), rx1 - rx0, t);
  const sz = s === 1 ? 25 : 50;
  ['fb', 'ig', 'li'].forEach((k, i) => ctx.drawImage(icons[k + sz], Math.round(SX(L.icons.x[i]) * s), Math.round(SY(L.icons.y) * s)));
  return { W, H, rgba: ctx.getImageData(0, 0, W, H).data };
}

function axis(d, ls, srcLen, outLen) {
  const o0 = Math.max(0, Math.floor(d)), o1 = Math.min(outLen, Math.ceil(d + srcLen * ls));
  const start = [], count = [], js = [], ws = [];
  for (let o = o0; o < o1; o++) {
    const a = (o - d) / ls, b = (o + 1 - d) / ls;
    const j0 = Math.max(0, Math.floor(a)), j1 = Math.min(srcLen, Math.ceil(b));
    start.push(js.length);
    for (let j = j0; j < j1; j++) { const ov = Math.min(b, j + 1) - Math.max(a, j); if (ov > 0) { js.push(j); ws.push(ov * ls); } }
    count.push(js.length - start[start.length - 1]);
  }
  return { o0, o1, start: Int32Array.from(start), count: Int32Array.from(count), j: Int32Array.from(js), w: Float32Array.from(ws) };
}

function drawLogoFrame(fi, ax, ay, base, W, out) {
  const col = fi % A.cols, row = (fi / A.cols) | 0;
  const sx0 = col * (A.frameW + A.gutter), sy0 = row * (A.frameH + A.gutter);
  for (let oy = ay.o0, yi = 0; oy < ay.o1; oy++, yi++) {
    const ys = ay.start[yi], yc = ay.count[yi];
    for (let ox = ax.o0, xi = 0; ox < ax.o1; ox++, xi++) {
      const xs = ax.start[xi], xc = ax.count[xi];
      let a = 0, r = 0, g = 0, b = 0;
      for (let p = 0; p < yc; p++) {
        const wy = ay.w[ys + p], rowOff = (sy0 + ay.j[ys + p]) * sheetW + sx0;
        for (let q = 0; q < xc; q++) {
          const k = sheetCls[rowOff + ax.j[xs + q]];
          if (k) { const w = wy * ax.w[xs + q], c = BRAND[k - 1]; a += w; r += w * c[0]; g += w * c[1]; b += w * c[2]; }
        }
      }
      const bi = (oy * W + ox) * 4;
      let R = base[bi], G = base[bi + 1], B = base[bi + 2];
      if (a > 0) { if (a > 1) { r /= a; g /= a; b /= a; a = 1; } R = R * (1 - a) + r; G = G * (1 - a) + g; B = B * (1 - a) + b; }
      out[oy * W + ox] = PAL.index(R, G, B);
    }
  }
}

function frameList() {
  const seq = [];
  for (let i = 1; i < A.count; i += FPS_STEP) seq.push(i);
  if (seq[seq.length - 1] !== A.count - 1) seq.push(A.count - 1);
  return seq.map((fi, k) => {
    const end = k + 1 < seq.length ? seq[k + 1] : A.count;
    let ms = 0; for (let i = fi; i < end; i++) ms += A.delays[i];
    return { fi, ms };
  });
}

const tick = () => new Promise((r) => setTimeout(r, 0));
async function buildGif(s, runs, stillOnly) {
  const { W, H, rgba } = renderBase(s, runs);
  const ls = L.logo.scale * s;
  const ax = axis(SX(L.logo.x + A.srcBox[0] * L.logo.scale) * s, ls, A.frameW, W);
  const ay = axis(SY(L.logo.y + A.srcBox[1] * L.logo.scale) * s, ls, A.frameH, H);
  const prev = new Uint8Array(W * H);
  for (let i = 0, p = 0; i < prev.length; i++, p += 4) prev[i] = PAL.index(rgba[p], rgba[p + 1], rgba[p + 2]);
  drawLogoFrame(0, ax, ay, rgba, W, prev);
  const frames = [{ x: 0, y: 0, w: W, h: H, idx: prev.slice(), ms: PAUSE_MS, transparent: false }];
  if (stillOnly) return new Blob([encodeGif(W, H, frames)], { type: 'image/gif' });
  await framesReady();
  const next = prev.slice();
  const seq = frameList();
  for (let k = 0; k < seq.length; k++) {
    if (k % 8 === 7) await tick();
    const { fi, ms } = seq[k];
    drawLogoFrame(fi, ax, ay, rgba, W, next);
    let bx0 = W, by0 = H, bx1 = -1, by1 = -1;
    for (let y = ay.o0; y < ay.o1; y++) {
      const row = y * W;
      for (let x = ax.o0; x < ax.o1; x++) if (next[row + x] !== prev[row + x]) { if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; by1 = y; }
    }
    if (bx1 < 0) { frames[frames.length - 1].ms += ms; continue; }
    const fw = bx1 - bx0 + 1, fh = by1 - by0 + 1, sub = new Uint8Array(fw * fh);
    for (let y = 0; y < fh; y++) {
      const row = (by0 + y) * W + bx0;
      for (let x = 0; x < fw; x++) { const v = next[row + x]; sub[y * fw + x] = v === prev[row + x] ? PAL.transparent : v; prev[row + x] = v; }
    }
    frames.push({ x: bx0, y: by0, w: fw, h: fh, idx: sub, ms, transparent: true });
  }
  return new Blob([encodeGif(W, H, frames)], { type: 'image/gif' });
}

/* ---------- download ---------- */
const btn = $('download'), msg = $('msg');
const downloadsP = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads').catch(() => null)
  : Promise.resolve(null);
let resultUrl = null;
const kb = (n) => Math.round(n / 1024) + ' KB';
function fileName() {
  const name = (text.enName || '').replace(/[\\/:*?"<>|\u0000-\u001F]+/g, ' ').replace(/\s+/g, ' ').trim();
  return `${name ? name + ' - ' : ''}Placemaker Email Signature.gif`;
}
function showFallback(blob) {
  if (resultUrl) URL.revokeObjectURL(resultUrl);
  resultUrl = URL.createObjectURL(blob);
  $('result').src = resultUrl;
  $('fallback').hidden = false;
  msg.textContent = 'Your GIF is ready below (' + kb(blob.size) + ').';
}
let ready = false;
btn.addEventListener('click', async () => {
  if (!ready) return;
  if (document.activeElement && document.activeElement.classList.contains('ed')) document.activeElement.blur();
  btn.disabled = true;
  msg.textContent = 'Making your GIF…';
  try {
    await fontsReady();
    const blob = await buildGif(1, readRuns());
    window.__lastGif = blob;
    const name = fileName();
    const dl = await downloadsP;
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); msg.textContent = 'Downloaded (' + kb(blob.size) + ').'; }
      catch (e) {
        if (e && e.code === 'declined') msg.textContent = 'Download cancelled.';
        else if (e && e.code === 'rate_limited') msg.textContent = 'A save window is already open.';
        else showFallback(blob);
      }
    } else if (window.claude) {
      showFallback(blob);
    } else {
      if (resultUrl) URL.revokeObjectURL(resultUrl);
      resultUrl = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = resultUrl; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      msg.textContent = 'Downloaded (' + kb(blob.size) + ').';
    }
  } catch (e) {
    msg.textContent = 'The GIF could not be made. Reload the page and try again.';
  }
  btn.disabled = false;
});

/* ---------- start: draw the logo, line and icons behind the editable text ---------- */
(async () => {
  btn.disabled = true;
  const art = $('art');
  try {
    await Promise.all([prepare(), fontsReady()]);
    const still = URL.createObjectURL(await buildGif(2, [], true));
    art.src = still;
    ready = true;
    btn.disabled = false;
    await tick();
    const moving = URL.createObjectURL(await buildGif(2, []));
    art.src = moving;
    URL.revokeObjectURL(still);
  } catch (e) {
    if (!ready) msg.textContent = 'The logo could not be loaded. Reload the page.';
  }
  btn.disabled = !ready;
})();
window.__sig = { setZoom: (z) => { zoom = z; stage.style.transform = `scale(${z})`; fit.style.width = W1 * z + 'px'; fit.style.height = H1 * z + 'px'; } };
})();
</script>
